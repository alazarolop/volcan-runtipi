services:
  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    privileged: true
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
    networks:
      - tipi_main_network
    labels:
      generated: true
    x-runtipi:
      internal_port: 2375
      is_main: true
networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true
x-runtipi:
  schema_version: 2