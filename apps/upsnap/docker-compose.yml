services:
  upsnap:
    image: 'ghcr.io/seriousm4x/upsnap:5'
    volumes:
      - '${APP_DATA_DIR}/data:/app/pb_data'
    environment:
      - 'TZ=${TZ}'
      - 'UPSNAP_HTTP_LISTEN=127.0.0.1:${APP_PORT}'
    network_mode: host # host is required for WOL magic packets
    cap_add:
      - NET_RAW # NET_RAW is required for privileged ping and network device scan (nmap)
    cap_drop:
      - ALL
    restart: unless-stopped
    x-runtipi:
      internal_port: ${APP_PORT}
      is_main: true
x-runtipi:
  schema_version: 2