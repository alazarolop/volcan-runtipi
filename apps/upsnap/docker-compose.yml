services:
  upsnap:
    image: 'ghcr.io/seriousm4x/upsnap:5.7.0'
    volumes:
      - '${APP_DATA_DIR}/data:/app/pb_data'
    environment:
      - 'TZ=${TZ}'
      - 'UPSNAP_HTTP_LISTEN=0.0.0.0:${APP_PORT}'
    network_mode: host # host is required for WOL magic packets
    cap_add:
      - NET_RAW # NET_RAW is required for privileged ping and network device scan (nmap)
    cap_drop:
      - ALL
    restart: unless-stopped
    labels:
      generated: true
      traefik.enable: true
      traefik.http.middlewares.upsnap-volcanapps-web-redirect.redirectscheme.scheme: https
      traefik.http.services.upsnap-volcanapps.loadbalancer.server.url: "http://${INTERNAL_IP}:${APP_PORT}"
      traefik.http.routers.upsnap-volcanapps-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.upsnap-volcanapps-insecure.entrypoints: web
      traefik.http.routers.upsnap-volcanapps-insecure.service: upsnap-volcanapps
      traefik.http.routers.upsnap-volcanapps-insecure.middlewares: upsnap-volcanapps-web-redirect
      traefik.http.routers.upsnap-volcanapps.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.upsnap-volcanapps.entrypoints: websecure
      traefik.http.routers.upsnap-volcanapps.service: upsnap-volcanapps
      traefik.http.routers.upsnap-volcanapps.tls.certresolver: myresolver
    x-runtipi:
      internal_port: ${APP_PORT}
      is_main: true
    restart: unless-stopped
x-runtipi:
  schema_version: 2